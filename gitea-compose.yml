# ============================================================
# Gitea 私有化部署（复用 NAS 上已有 PG 5435）
#
# 权限说明：
#   USER_UID / USER_GID 必须与宿主机挂载目录 ./gitea-data 的属主一致，
#   否则容器内 git 用户无法写入，日志会报 permission denied。
#
#   查看属主命令（在 NAS 上执行）：
#     ls -ln /volume1/docker/gitea    # 或你实际的 gitea-data 目录
#   输出的第三列是 UID，第四列是 GID，填入下方即可。
#
# 用法：
#   docker compose -f gitea-compose.yml up -d
#   初始化: 首次启动后访问 http://100.66.1.5:3000 创建管理员账号
#   （本 compose 已设 INSTALL_LOCK=true，跳过 Web 安装向导）
# ============================================================
services:
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: always
    environment:
      # ----- 权限：改成 ./gitea-data 目录属主的 UID/GID -----
      - USER_UID=1000
      - USER_GID=1000
      # ----- 数据库（复用 NAS PG，需先建库）-----
      #   psql -h 100.66.1.5 -p 5435 -U dbuser -d postgres \
      #     -c "CREATE DATABASE gitea OWNER dbuser;"
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=100.66.1.5:5435
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=admin
      - GITEA__database__PASSWD=Qingcy@0613
      - GITEA__database__SSL_MODE=disable
      # ----- 服务 -----
      - GITEA__server__DOMAIN=100.66.1.5
      - GITEA__server__ROOT_URL=http://100.66.1.5:3000/
      - GITEA__server__SSH_DOMAIN=100.66.1.5
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=2222
      # ----- 跳过安装向导，启用 Actions -----
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__actions__ENABLED=true
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - ./gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"   # Web
      - "2222:22"     # SSH（git clone/push）
