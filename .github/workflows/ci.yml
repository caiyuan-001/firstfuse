# ============================================================
# FirstFuse CI — 提交即跑
#
# 前端：pnpm install → vue-tsc → vite build
# 后端：mvn verify（skipTests，CI 没有 NAS 数据库）
#
# 推送 tag v* 时额外跑 docker build（镜像是否能正确构建）
# ============================================================
name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ==================== 前端 ====================
  web:
    name: Web (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ==================== 后端 ====================
  server:
    name: Server (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify (skipTests — CI 无 NAS)
        run: mvn -B -DskipTests verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: apps/server/target/firstfuse-server.jar
          retention-days: 7

  # ==================== 镜像构建（tag 触发） ====================
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: apps/server
          file: apps/server/Dockerfile
          push: false
          tags: firstfuse-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: firstfuse-web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
