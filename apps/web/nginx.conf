server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============= API 代理 =============
    # 前端请求 /api/v1/* → 后端容器 :8080/api/v1/*
    # 后端 context-path 已包含 /api/v1，不需要 rewrite
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # 大文件（MinIO 上传最大 20MB）
        client_max_body_size 50m;

        # 豆包思考模型响应 15-30s，nginx 默认 60s 够用，留余量
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ============= 健康检查端点 =============
    # /health 不走 /api 前缀，后端也有单独映射
    location /health {
        proxy_pass http://server:8080/api/v1/health;
        access_log off;
    }

    # ============= SPA fallback =============
    # 所有非文件路由回 index.html 让 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============= 静态资源缓存 =============
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============= Gzip =============
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
