spring:
  application:
    name: firstfuse-server
  profiles:
    active: dev
  # 启动时执行幂等业务种子（ON CONFLICT DO NOTHING，可重复执行）
  sql:
    init:
      mode: always
      data-locations: classpath:sql/03_seed_biz.sql,classpath:sql/04_ai_m3.sql,classpath:sql/05_m4.sql
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /api/v1

# JWT 配置（secret 从 .env 注入，见 apps/server/.env）
jwt:
  secret: ${JWT_SECRET:CHANGE-ME-IN-PRODUCTION-USE-ENV-VAR-LONG-ENOUGH-32CHARS}
  access-token-expire-seconds: 7200   # 2h
  refresh-token-expire-seconds: 604800  # 7d

# 演示环境硬编码租户（避免首次需 Docker 起 PostgreSQL 才能跑通）
demo:
  enabled: true

# AI 网关（OpenAI 兼容）。未配置 base-url/api-key 时全部走本地演示生成
ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout-ms: 60000

# NebulaGraph（NAS），通过 nebula-java Thrift 客户端连接 graphd；enabled=false 时图谱走 PG 派生
nebula:
  enabled: ${NEBULA_ENABLED:false}
  host: ${NEBULA_HOST:100.66.1.5}
  port: ${NEBULA_PORT:9669}
  username: ${NEBULA_USERNAME:root}
  password: ${NEBULA_PASSWORD:nebula}
  space: ${NEBULA_SPACE:firstfuse}

# MinIO（NAS），M4 文件上传下载；连接信息由 .env 注入
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:firstfuse}

# 接口限流（Redis 固定窗口，每分钟）
rate-limit:
  login-per-minute: ${RATE_LOGIN_PER_MINUTE:60}
  ai-per-minute: ${RATE_AI_PER_MINUTE:30}

# Actuator 观测端点（context-path 拼出最终路径 /api/v1/actuator/health）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true
    redis:
      enabled: true
    defaults:
      enabled: true
  info:
    env:
      enabled: true
    build:
      enabled: true

---
# dev 环境连接信息全部由 apps/server/.env 通过 run-dev.ps1 注入，默认值指向本机
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:firstfuse}?currentSchema=public
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

logging:
  level:
    com.chuangrongtong.firstfuse: DEBUG
    org.hibernate.SQL: DEBUG
